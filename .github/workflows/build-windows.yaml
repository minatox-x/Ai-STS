name: Build Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab too

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install llama-cpp-python==0.2.77 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --force-reinstall
          pip install pyinstaller

      - name: Run tests
        run: |
          pip install pytest
          pytest tests -q

      - name: Build executable
        run: pyinstaller build.spec

      - name: Force copy missing DLLs (PyInstaller Fix)
        shell: cmd
        run: |
          python -c "import os, shutil, llama_cpp; src = os.path.dirname(llama_cpp.__file__); dest = os.path.join('dist', 'Friend', '_internal', 'llama_cpp'); shutil.copytree(src, dest, dirs_exist_ok=True); print('Copied llama.dll successfully!')"
          
      - name: Zip build output
        run: |
          powershell Compress-Archive -Path dist/Friend/* -DestinationPath Friend-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Friend-windows
          path: Friend-windows.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Friend-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
